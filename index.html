<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Cube Illusion</title>
  <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(2, 2, 5);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

// Convert hex to RGB
function hexToRgbArray(hex) {
  const c = new THREE.Color(hex);
  return [c.r, c.g, c.b];
}

// Create a custom triangle from 3 vertices
function createTriangle(v1, v2, v3, color) {
  const geometry = new THREE.BufferGeometry();
  const vertices = new Float32Array([...v1, ...v2, ...v3]);
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  
  const colorArray = new Float32Array([
    ...hexToRgbArray(color),
    ...hexToRgbArray(color),
    ...hexToRgbArray(color)
  ]);
  geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
  
  geometry.computeVertexNormals();
  
  const material = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  return new THREE.Mesh(geometry, material);
}

// Color palette from image
const palette = [0xA183FF, 0x93E5AB, 0xF47EFF, 0x76D1FF, 0xB1D36B];

// Function to build a 3D cube face illusion with triangle segments
function buildCubeFace(origin, normal, up, size, faceColorOffset = 0) {
  const triangles = [];
  const center = new THREE.Vector3(...origin);

  for (let i = 0; i < 6; i++) {
    const angle1 = (Math.PI / 3) * i;
    const angle2 = (Math.PI / 3) * (i + 1);

    const dir1 = new THREE.Vector3().copy(up).applyAxisAngle(normal, angle1).multiplyScalar(size);
    const dir2 = new THREE.Vector3().copy(up).applyAxisAngle(normal, angle2).multiplyScalar(size);

    const p1 = new THREE.Vector3().addVectors(center, dir1);
    const p2 = new THREE.Vector3().addVectors(center, dir2);

    const triangle = createTriangle(center.toArray(), p1.toArray(), p2.toArray(), palette[(i + faceColorOffset) % palette.length]);
    triangles.push(triangle);
  }

  return triangles;
}

// Build top face
const top = buildCubeFace([0, 0.75, 0], new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0), 1, 0);
top.forEach(t => scene.add(t));

// Build left face (rotate around X)
const left = buildCubeFace([-0.87, -0.43, 0], new THREE.Vector3(-1, 0, 1).normalize(), new THREE.Vector3(1, 0, 0), 1, 2);
left.forEach(t => scene.add(t));

// Build right face (rotate other direction)
const right = buildCubeFace([0.87, -0.43, 0], new THREE.Vector3(1, 0, 1).normalize(), new THREE.Vector3(1, 0, 0), 1, 4);
right.forEach(t => scene.add(t));

function animate() {
  requestAnimationFrame(animate);
  scene.rotation.y += 0.003;
  renderer.render(scene, camera);
}
animate();
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/OBJExporter.js"></script>
</script>
</body>
</html>
