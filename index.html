    const cols = Math.ceil(SOURCE_WIDTH / PIXEL_SIZE);
    const rows = Math.ceil(SOURCE_HEIGHT / PIXEL_SIZE);

    /*
    Render at a higher internal resolution than the visible pixel grid.
    Each logical pixel is 2x2 canvas pixels, which lets the browser
    preserve clean edges without turning the whole image blurry.
    */
    const UPSCALE = 2;

    canvas.width = cols * UPSCALE;
    canvas.height = rows * UPSCALE;

    ctx.imageSmoothingEnabled = true;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let gy = 0; gy < rows; gy++) {
        for (let gx = 0; gx < cols; gx++) {
            const x0 = gx * PIXEL_SIZE;
            const y0 = gy * PIXEL_SIZE;

            let totalWeight = 0;
            let rr = 0;
            let gg = 0;
            let bb = 0;
            let coverage = 0;

            /*
            Multi-sample each logical pixel.
            Interior pixels stay solid.
            Edge pixels get proportional coverage, creating clean diagonals.
            */
            for (let sy = 0; sy < EDGE_SAMPLES; sy++) {
                for (let sx = 0; sx < EDGE_SAMPLES; sx++) {
                    const px = Math.min(
                        SOURCE_WIDTH - 1,
                        Math.floor(
                            x0 + ((sx + 0.5) / EDGE_SAMPLES) * PIXEL_SIZE
                        )
                    );

                    const py = Math.min(
                        SOURCE_HEIGHT - 1,
                        Math.floor(
                            y0 + ((sy + 0.5) / EDGE_SAMPLES) * PIXEL_SIZE
                        )
                    );

                    const i = (py * SOURCE_WIDTH + px) * 4;

                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const a = data[i + 3] / 255;

                    // Black source pixels count as background.
                    const visible =
                        a > 0.02 &&
                        !(r < 10 && g < 10 && b < 10);

                    if (!visible) continue;

                    coverage += a;

                    rr += r * a;
                    gg += g * a;
                    bb += b * a;
                    totalWeight += a;
                }
            }

            const sampleCount = EDGE_SAMPLES * EDGE_SAMPLES;
            const alpha = Math.min(1, coverage / sampleCount);

            if (totalWeight <= 0 || alpha < 0.025) continue;

            const r = Math.round(rr / totalWeight);
            const g = Math.round(gg / totalWeight);
            const b = Math.round(bb / totalWeight);

            /*
            Blend edge pixels against black instead of making them fully solid.
            This is anti-aliasing by geometry coverage, not blur.
            */
            const br = Math.round(r * alpha);
            const bg = Math.round(g * alpha);
            const bb2 = Math.round(b * alpha);

            ctx.fillStyle = `rgb(${br},${bg},${bb2})`;

            const dx = gx * UPSCALE;
            const dy = gy * UPSCALE;

            ctx.fillRect(dx, dy, UPSCALE, UPSCALE);
        }
    }
}

source.onload = render;
</script>

</body>
</html>
